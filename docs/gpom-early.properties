gpom.registry.parallelRegisterEvents.recipes.enabled=false
# gpom.registry.parallelRegisterEvents.workers - Worker count for parallel registry listener dispatch. 0 lets GPOM choose a bounded automatic value.
gpom.registry.parallelRegisterEvents.workers=0
# gpom.registry.parallelRegisterEvents.queuedCommit - Uses per-listener registry proxies and commits queued mutations back to Forge in original listener order.
gpom.registry.parallelRegisterEvents.queuedCommit=true
# gpom.registry.parallelRegisterEvents.proxyEventRegistry - Passes GPOM's queueing registry proxy to non-immediate registry worker listeners so normal event.getRegistry().register calls avoid ForgeRegistry's synchronized backing lock.
gpom.registry.parallelRegisterEvents.proxyEventRegistry=true
# gpom.registry.parallelRegisterEvents.proxyEventRegistryDenylist - Comma-separated mod ids or modid@registry entries that must receive the real Forge registry object even when proxyEventRegistry is enabled; registrations still queue through the coremod hook.
gpom.registry.parallelRegisterEvents.proxyEventRegistryDenylist=moarsigns@minecraft:recipes,cyclopscore@minecraft:recipes,integrateddynamics@minecraft:recipes
# gpom.registry.parallelRegisterEvents.immediateCommitRegistries - Comma-separated registry names whose worker-thread registrations are serialized into Forge immediately instead of queued until the listener batch commits; keep narrow because this reduces parallelism.
gpom.registry.parallelRegisterEvents.immediateCommitRegistries=minecraft:items,minecraft:entities
# gpom.registry.parallelRegisterEvents.proxyImmediateRegistries - Passes GPOM's ordered immediate-commit registry proxy to immediate registries too, preserving visibility while avoiding direct concurrent Forge registry mutation.
gpom.registry.parallelRegisterEvents.proxyImmediateRegistries=true
# gpom.registry.parallelRegisterEvents.orderedWaveRegistries - Comma-separated registry names that must keep conservative adjacent dependency waves; remove a registry here only when testing more aggressive topological scheduling.
gpom.registry.parallelRegisterEvents.orderedWaveRegistries=minecraft:items
# gpom.registry.parallelRegisterEvents.immediateCommitWaitDiagnosticsMillis - Logs ordered immediate-commit coordinator state when a worker waits longer than this many milliseconds; 0 disables this diagnostic.
gpom.registry.parallelRegisterEvents.immediateCommitWaitDiagnosticsMillis=0
# gpom.registry.parallelRegisterEvents.dependencyGating - Splits registry worker batches at declared mod dependency edges so dependent listeners wait for required earlier listeners.
gpom.registry.parallelRegisterEvents.dependencyGating=true
# gpom.registry.parallelRegisterEvents.allowlist - Comma-separated mod ids whose registry listeners may run off-thread; '*' allows every identified mod before denylist filtering.
gpom.registry.parallelRegisterEvents.allowlist=*
