gpom.crafttweaker.parallelScriptParsing.offThreadZenParse=true
# gpom.crafttweaker.parallelScriptParsing.suppressGlobalDebugCompileLogs - Suppresses CraftTweaker global debug-mode ZenScript compile chatter while preserving per-script debug and normal error logging.
gpom.crafttweaker.parallelScriptParsing.suppressGlobalDebugCompileLogs=true
