# GPOM early config - performance profile without QoL/probes
# Generated from src/main/java/com/l/gpom/config/GpomEarlyConfig.java after commit 762af8a.
# Purpose: enables GPOM performance/startup/loading/cache improvements while disabling QoL UI features, visual overlays, profilers, probes, and deep diagnostics.
# Existing denylists still win over broad allowlists; this file is repo-local and is not installed automatically.
# To use it, copy it to an instance as config/gpom-early.properties.

# General Purpose Optimization Mod early-loading config.
# Comments and section spacing follow GPOM's generated config layout; values are this performance profile.

# == File Format ==
# This file is loaded before Forge's normal config system exists. Comma lists accept mod ids unless noted; '*' means every candidate; denylist entries always win.
# fml.parallel.workers - Shared worker-count fallback for all threaded FML phases. 0 lets GPOM choose a bounded value from CPU and memory.
fml.parallel.workers=0

# == Construction Parallelism ==
# Controls FMLConstructionEvent worker dispatch. This is the most fragile phase because mod instances, proxies, and automatic subscribers are created here.
# fml.parallel.construct.enabled - Enables worker dispatch for FMLConstructionEvent handlers that pass the allowlist and denylist filters.
fml.parallel.construct.enabled=true
# fml.parallel.construct.workers - Worker count for construction. 0 inherits fml.parallel.workers, then automatic sizing if the shared value is also 0.
fml.parallel.construct.workers=0
# fml.parallel.construct.allowlist - Comma-separated mod ids allowed to run construction off-thread; '*' allows every loaded mod before denylist filtering.
fml.parallel.construct.allowlist=*
# fml.parallel.construct.denylist - Comma-separated mod ids forced back to the main thread during construction; entries here override the allowlist.
fml.parallel.construct.denylist=aether_legacy
# fml.parallel.construct.continueOnModError - Diagnostic-only mode that records a construction failure and keeps scheduling later mods. Use false for normal play.
fml.parallel.construct.continueOnModError=false
# fml.parallel.construct.dag.enabled - Uses dependency-aware scheduling for Construction. Serial construction handlers remain list-order barriers for safety.
fml.parallel.construct.dag.enabled=true

# == PreInit Parallelism ==
# Controls FMLPreInitializationEvent worker dispatch. This phase touches registries, model loaders, configs, and client resource setup, so use tested allowlists.
# fml.parallel.preInit.enabled - Enables worker dispatch for FMLPreInitializationEvent handlers that pass the allowlist and denylist filters.
fml.parallel.preInit.enabled=true
# fml.parallel.preInit.workers - Worker count for PreInit. 0 inherits fml.parallel.workers, then automatic sizing if the shared value is also 0.
fml.parallel.preInit.workers=0
# fml.parallel.preInit.allowlist - Comma-separated mod ids allowed to run PreInit off-thread; '*' allows every loaded mod before denylist filtering.
fml.parallel.preInit.allowlist=*
# fml.parallel.preInit.denylist - Comma-separated mod ids forced back to the main thread during PreInit; entries here override the allowlist.
fml.parallel.preInit.denylist=enderio,enderiobase,enderioconduits,enderioconduitsappliedenergistics,enderioconduitsopencomputers,enderioconduitsrefinedstorage,enderiointegrationforestry,enderiointegrationtic,enderiointegrationticlate,enderioinvpanel,enderiomachines,enderiopowertools,enderioendergy,erebus,extracells,draconicevolution,aether_legacy,binniecore,binniedesign,genetics,botany,extrabees,extratrees,gendustry,simplyjetpacks,projectred-core,projectred-illumination,projectred-compat,projectred-integration,projectred-transmission,projectred-fabrication,projectred-expansion,projectred-relocation,projectred-transportation,projectred-exploration
# fml.parallel.preInit.continueOnModError - Diagnostic-only mode that records a PreInit failure and keeps scheduling later mods. Use false for normal play.
fml.parallel.preInit.continueOnModError=false
# fml.parallel.preInit.dag.enabled - Uses dependency-aware scheduling for PreInit instead of strict list order. Experimental until missing-registry behavior is retested.
fml.parallel.preInit.dag.enabled=true

# == Init Parallelism ==
# Controls FMLInitializationEvent worker dispatch. Mods that create OpenGL objects, textures, shaders, or shared global state should stay denied.
# fml.parallel.init.enabled - Enables worker dispatch for FMLInitializationEvent handlers that pass the allowlist and denylist filters.
fml.parallel.init.enabled=true
# fml.parallel.init.workers - Worker count for Init. 0 inherits fml.parallel.workers, then automatic sizing if the shared value is also 0.
fml.parallel.init.workers=0
# fml.parallel.init.allowlist - Comma-separated mod ids allowed to run Init off-thread; '*' allows every loaded mod before denylist filtering.
fml.parallel.init.allowlist=*
# fml.parallel.init.denylist - Comma-separated mod ids forced back to the main thread during Init; entries here override the allowlist.
fml.parallel.init.denylist=enderio,enderiobase,enderioconduits,enderioconduitsappliedenergistics,enderioconduitsopencomputers,enderioconduitsrefinedstorage,enderiointegrationforestry,enderiointegrationtic,enderiointegrationticlate,enderioinvpanel,enderiomachines,enderiopowertools,enderioendergy,careerbees,commoncapabilities,cyclopscore,integratedderivative,integrateddynamics,integrateddynamicscompat,integratednbt,integratedtunnels,integratedtunnelscompat
# fml.parallel.init.continueOnModError - Diagnostic-only mode that records an Init failure and keeps scheduling later mods. Use false for normal play.
fml.parallel.init.continueOnModError=false
# fml.parallel.init.dag.enabled - Uses dependency-aware scheduling for Init instead of strict list order, while keeping denied handlers on the main thread.
fml.parallel.init.dag.enabled=true

# == PostInit Parallelism ==
# Controls FMLPostInitializationEvent worker dispatch. Usually safer than PreInit/Init, but recipe mutation and render integration still need pack validation.
# fml.parallel.postInit.enabled - Enables worker dispatch for FMLPostInitializationEvent handlers that pass the allowlist and denylist filters.
fml.parallel.postInit.enabled=true
# fml.parallel.postInit.workers - Worker count for PostInit. 0 inherits fml.parallel.workers, then automatic sizing if the shared value is also 0.
fml.parallel.postInit.workers=0
# fml.parallel.postInit.allowlist - Comma-separated mod ids allowed to run PostInit off-thread; '*' allows every loaded mod before denylist filtering.
fml.parallel.postInit.allowlist=*
# fml.parallel.postInit.denylist - Comma-separated mod ids forced back to the main thread during PostInit; entries here override the allowlist.
fml.parallel.postInit.denylist=crafttweaker,cofhcore,cyclopscore,integrateddynamics,integrateddynamicscompat,integratednbt,integratedtunnels,integratedtunnelscompat,journeymap,thebetweenlands,iceandfire,scannable,randomthings,nuclearcraft,topaddons,thaumicaugmentation,smoothfont
# fml.parallel.postInit.continueOnModError - Diagnostic-only mode that records a PostInit failure and keeps scheduling later mods. Use false for normal play.
fml.parallel.postInit.continueOnModError=false
# fml.parallel.postInit.dag.enabled - Uses dependency-aware scheduling for PostInit so independent later handlers can run while main-thread-only handlers execute.
fml.parallel.postInit.dag.enabled=true

# == LoadComplete Parallelism ==
# Controls FMLLoadCompleteEvent worker dispatch. This is the safest lifecycle phase, but HEI/JER and client-global mods can still serialize the wall time.
# fml.parallel.loadComplete.enabled - Enables worker dispatch for FMLLoadCompleteEvent handlers that pass the allowlist and denylist filters.
fml.parallel.loadComplete.enabled=true
# fml.parallel.loadComplete.workers - Worker count for LoadComplete. 0 inherits fml.parallel.workers, then automatic sizing if the shared value is also 0.
fml.parallel.loadComplete.workers=0
# fml.parallel.loadComplete.allowlist - Comma-separated mod ids allowed to run LoadComplete off-thread; '*' allows every loaded mod before denylist filtering.
fml.parallel.loadComplete.allowlist=*
# fml.parallel.loadComplete.denylist - Comma-separated mod ids forced back to the main thread during LoadComplete; entries here override the allowlist.
fml.parallel.loadComplete.denylist=
# fml.parallel.loadComplete.continueOnModError - Diagnostic-only mode that records a LoadComplete failure and keeps scheduling later mods. Use false for normal play.
fml.parallel.loadComplete.continueOnModError=false
# fml.parallel.loadComplete.dag.enabled - Uses dependency-aware scheduling for LoadComplete, including independent lookahead around long main-thread handlers such as HEI.
fml.parallel.loadComplete.dag.enabled=true

# == Thread Safety Guards ==
# Global safety switches used by the lifecycle scheduler while phases are running in workers.
# fml.parallel.registrySerialization.enabled - Serializes Forge registry writes while lifecycle workers are active to avoid HashBiMap and ForgeRegistry concurrent mutation.
fml.parallel.registrySerialization.enabled=true
# fml.parallel.clientLifecycleOpenGlScan.enabled - Keeps PreInit/Init/PostInit/LoadComplete handlers on the main thread when their mod jar references LWJGL/OpenGL/Input bytecode. This preserves client thread affinity without editing denylists.
fml.parallel.clientLifecycleOpenGlScan.enabled=true
# fml.parallel.autoQuarantineGlErrors.enabled - Diagnostic helper that appends catchable OpenGL thread offenders to the relevant phase denylist for the next launch.
fml.parallel.autoQuarantineGlErrors.enabled=false
# fml.parallel.autoQuarantineGlErrors.includeRelatedMods - When auto-quarantining, also deny likely dependent/related mods so the next launch moves the whole cluster back to main thread.
fml.parallel.autoQuarantineGlErrors.includeRelatedMods=true

# == Construction Shortcuts ==
# Fine-grained controls for GPOM's Forge construction shortcuts. Denied mods fall back to Forge's original behavior for the named shortcut only.
# gpom.construction.genericSidedProxies.denylist - Comma-separated mod ids that must use Forge's original sided-proxy injection instead of GPOM's generic proxy shortcut.
gpom.construction.genericSidedProxies.denylist=thaumcraft,aether_legacy,architecturecraft
# gpom.construction.genericAutomaticSubscribers.denylist - Comma-separated mod ids that must use Forge's original AutomaticEventSubscriber and EventBus.register(Class) paths instead of GPOM's generic/lazy subscriber shortcuts.
gpom.construction.genericAutomaticSubscribers.denylist=thaumcraft,thaumcraftfix,chisel,ctm,unlimitedchiselworks,thebetweenlands,twilightforest,erebus,plustic,aether_legacy

# == HEI QoL ==
# Client-side Had Enough Items integration tweaks. These only register when the relevant target mod is loaded.
# gpom.hei.extendedCraftingLowerTierTransfer.enabled - Adds HEI transfer buttons for lower-tier ExtendedCrafting table recipes in higher-tier table GUIs, mapping the lower recipe into the centered sub-grid.
gpom.hei.extendedCraftingLowerTierTransfer.enabled=true
# gpom.hei.draconicFusionTransfer.enabled - Adds a HEI transfer button for Draconic Evolution Fusion Crafting that stages catalyst and injector ingredients through a server-validated packet.
gpom.hei.draconicFusionTransfer.enabled=true

# == GPOM Logging ==
# Controls GPOM's own logger and high-volume categories. Keep the root logger enabled when diagnostics such as world lifecycle snapshots are needed.
# gpom.logging.enabled - Master switch for GPOM's own logger. If false, GPOM diagnostics including WorldLifecycle lines are suppressed.
gpom.logging.enabled=false
# gpom.logging.fmlScheduler.enabled - Enables lifecycle scheduler status lines such as worker waits, phase transitions, and serialized fallback notices.
gpom.logging.fmlScheduler.enabled=false
# gpom.logging.optimizationInfo.enabled - Enables one-time informational lines from optimization installers and exact-version fast paths.
gpom.logging.optimizationInfo.enabled=false
# gpom.logging.cacheInfo.enabled - Enables cache hit, miss, invalidation, and persistence lines for GPOM input-validated caches.
gpom.logging.cacheInfo.enabled=false
# gpom.logging.asyncProbeLogs.enabled - Moves high-volume GPOM probe/profiler log writes onto a bounded daemon thread so console/file IO does not stall gameplay.
gpom.logging.asyncProbeLogs.enabled=false
# gpom.logging.asyncProbeLogs.queueSize - Maximum queued GPOM probe log lines before excess probe logs are dropped instead of blocking the caller.
gpom.logging.asyncProbeLogs.queueSize=8192

# == Cache Invalidation ==
# Mod ids, jar names, or file stems ignored by GPOM cache input signatures. Use this for local no-registry dev mods that change often but do not affect cached data.
# gpom.cacheInvalidation.denylist - Comma-separated mod ids, jar names, or file stems excluded from GPOM cache input signatures; default ignores local AUSM dev jar churn.
gpom.cacheInvalidation.denylist=ausm,gpom

# == Startup Profiler Logs ==
# Controls how much startup timing data GPOM emits. Disabling logs does not disable the underlying optimized code paths.
# gpom.startupProfiler.logs.enabled - Master switch for startup profiler log output. Timings may still be collected for UI or summaries.
gpom.startupProfiler.logs.enabled=false
# gpom.startupProfiler.logs.boot.enabled - Logs early boot/profiler setup markers.
gpom.startupProfiler.logs.boot.enabled=false
# gpom.startupProfiler.logs.phaseLifecycle.enabled - Logs lifecycle phase start, end, and wall-time markers.
gpom.startupProfiler.logs.phaseLifecycle.enabled=false
# gpom.startupProfiler.logs.modDetails.enabled - Logs per-mod lifecycle timings and wait attribution details.
gpom.startupProfiler.logs.modDetails.enabled=false
# gpom.startupProfiler.logs.phaseSummary.enabled - Logs per-phase top sink summaries.
gpom.startupProfiler.logs.phaseSummary.enabled=false
# gpom.startupProfiler.logs.phaseDigest.enabled - Logs compact phase digest lines intended for quick comparison between launches.
gpom.startupProfiler.logs.phaseDigest.enabled=false
# gpom.startupProfiler.logs.memoryDetails.enabled - Logs memory snapshots attached to startup phases and selected probes.
gpom.startupProfiler.logs.memoryDetails.enabled=false
# gpom.startupProfiler.logs.probes.enabled - Logs raw high-volume probe events from targeted deep profilers.
gpom.startupProfiler.logs.probes.enabled=false
# gpom.startupProfiler.logs.probeSummary.enabled - Logs aggregated probe summaries without the full raw probe stream.
gpom.startupProfiler.logs.probeSummary.enabled=false
# gpom.startupProfiler.logs.wallDiagnostics.enabled - Logs wall-clock diagnostics that explain dead time, waits, and scheduler under-utilization.
gpom.startupProfiler.logs.wallDiagnostics.enabled=false
# gpom.startupProfiler.logs.stackSamples.enabled - Logs stack-sample diagnostics for long-running startup sinks.
gpom.startupProfiler.logs.stackSamples.enabled=false
# gpom.startupProfiler.logs.resourceLoadOrder.enabled - Logs resource/model load-order diagnostics used to locate client-side loading stalls.
gpom.startupProfiler.logs.resourceLoadOrder.enabled=false
# gpom.startupProfiler.logs.nonFmlGaps.enabled - Logs material wall-clock gaps between Forge lifecycle events, even when raw startup profiler probes are disabled.
gpom.startupProfiler.logs.nonFmlGaps.enabled=false
# gpom.startupProfiler.logs.constructCriticalPath.enabled - Logs a compact Construction DAG critical-path breakdown, even when scheduler chatter and raw probes are disabled.
gpom.startupProfiler.logs.constructCriticalPath.enabled=false
# gpom.startupProfiler.logs.preInitCriticalPath.enabled - Logs a compact PreInitialization DAG critical-path breakdown, even when scheduler chatter and raw probes are disabled.
gpom.startupProfiler.logs.preInitCriticalPath.enabled=false
# gpom.startupProfiler.logs.loadCompleteCriticalPath.enabled - Logs a compact LoadComplete DAG critical-path breakdown, separating true handler time from progress-bar wait labels.
gpom.startupProfiler.logs.loadCompleteCriticalPath.enabled=false
# gpom.startupProfiler.logs.postPreInitProbeSummary.enabled - Records and logs compact POST_PREINIT_TRANSITION probe summaries without enabling raw probe lines or broad startup profiler output.
gpom.startupProfiler.logs.postPreInitProbeSummary.enabled=false
# gpom.startupProfiler.probeLogs.enabled - Compatibility alias for older configs; false also disables raw [Probe] startup lines.
gpom.startupProfiler.probeLogs.enabled=false
# gpom.startupProfiler.probeHighVolumeEventBusPosts - When true, records per-post probe totals for very high-volume EventBus events such as VintageFix model bake and CTM texture collection; keep false unless investigating those events directly.
gpom.startupProfiler.probeHighVolumeEventBusPosts=false
# gpom.startupProfiler.topCount - Number of top mods/probes included in startup profiler summaries.
gpom.startupProfiler.topCount=40
# gpom.startupProfiler.postPreInitProgressBars - Shows a coarse Forge loading bar during the long post-PreInit registry transition.
gpom.startupProfiler.postPreInitProgressBars=false
# gpom.startupProfiler.postPreInitProgressSteps - Step budget for the GPOM post-PreInit loading bar. Raise this if the UI reaches the maximum before the transition ends.
gpom.startupProfiler.postPreInitProgressSteps=96

# == Client Loading UI ==
# Optional client-only UI additions for early startup, world entry, and the main menu startup time display.
# gpom.earlySplash.enabled - Shows GPOM's isolated early splash window before Minecraft creates its own display.
gpom.earlySplash.enabled=true
# gpom.earlySplash.packName - Display label shown on the early splash window footer.
gpom.earlySplash.packName=MeatballCraft - Dimensional Ascension
# gpom.worldLoadingScreen.enabled - Shows GPOM's passive world-entry overlay during blank or early-0% world join periods.
gpom.worldLoadingScreen.enabled=true
# gpom.mainMenuStartupTime.enabled - Draws the last measured startup duration in the top-right corner of the main menu.
gpom.mainMenuStartupTime.enabled=true

# == Baubles UI ==
# Optional client-side Baubles inventory layout that moves Bauble slots to a Curios-like side rail and keeps quick-equip validated on the server.
# gpom.baubles.sideSlots.enabled - Repositions Baubles' expanded-inventory slots into a side rail and enables support hooks for extra Bauble slots. Requires Baubles.
gpom.baubles.sideSlots.enabled=false
# gpom.baubles.sideSlots.visibleRows - Number of Bauble slot rows visible per side-rail page.
gpom.baubles.sideSlots.visibleRows=7
# gpom.baubles.sideSlots.columns - Number of Bauble slot columns shown per side-rail page; page size is visibleRows * columns.
gpom.baubles.sideSlots.columns=2
# gpom.baubles.sideSlots.preferRight - When true, places the Baubles side rail to the right if there is screen space; false keeps the default left-side rail.
gpom.baubles.sideSlots.preferRight=false
# gpom.baubles.sideSlots.shiftRightClickEquip - Allows Shift+clicking a supported accessory stack while the side rail is open to quick-equip it through server-validated GPOM handling.
gpom.baubles.sideSlots.shiftRightClickEquip=true
# gpom.baubles.sideSlots.aether.enabled - Adds The Aether accessory slots to the same Baubles side rail when Aether Legacy is loaded. Requires gpom.baubles.sideSlots.enabled.
gpom.baubles.sideSlots.aether.enabled=false
# gpom.baubles.sideSlots.cosmeticArmor.enabled - Adds Cosmetic Armor Reworked armor slots to the same Baubles side rail when Cosmetic Armor Reworked is loaded. Requires gpom.baubles.sideSlots.enabled.
gpom.baubles.sideSlots.cosmeticArmor.enabled=false

# == World Lifecycle Profiling ==
# World load, unload, and dimension-switch diagnostics for tracking retained client state and memory leaks.
# gpom.worldLifecycleProfiler.enabled - Logs client world load, unload, and dimension-switch memory/state snapshots.
gpom.worldLifecycleProfiler.enabled=false
# gpom.worldLifecycleProfiler.forceGcBeforeSnapshots - Runs System.gc() before delayed world lifecycle snapshots to make retained-memory trends easier to see.
gpom.worldLifecycleProfiler.forceGcBeforeSnapshots=false
# gpom.worldLifecycleProfiler.delayedSnapshotMillis - Comma-separated delayed snapshot times after each world transition; include values below 30000 for fast switch testing.
gpom.worldLifecycleProfiler.delayedSnapshotMillis=2000,10000,25000
# gpom.worldLifecycleProfiler.deepAttribution.enabled - Logs detailed texture, resource-manager, and renderer ownership summaries for world memory leak attribution.
gpom.worldLifecycleProfiler.deepAttribution.enabled=false
# gpom.worldLifecycleProfiler.deepAttribution.maxEntries - Maximum entries shown in each WorldLifecycleDeep top-list; higher values increase log volume.
gpom.worldLifecycleProfiler.deepAttribution.maxEntries=8

# == AE2 Pattern Diagnostics ==
# Temporary one-shot world-load scanner that builds canonical AE2 crafting patterns for registered recipes and logs recipes that AE2 cannot validate.
# gpom.ae2.patternDiagnostics.enabled - Runs a temporary one-shot AE2 crafting-pattern validation scan on server overworld load. Keep false except while debugging pattern terminal failures.
gpom.ae2.patternDiagnostics.enabled=false
# gpom.ae2.patternDiagnostics.maxFailures - Maximum individual AE2 pattern diagnostic failure lines to log before suppressing additional details. Summary counts are always logged.
gpom.ae2.patternDiagnostics.maxFailures=200
# gpom.ae2.patternDiagnostics.logMismatchedOutputs - Logs recipes whose canonical ingredient choice matches a different recipe or output before AE2 pattern validation.
gpom.ae2.patternDiagnostics.logMismatchedOutputs=true
# gpom.ae2.patternDiagnostics.skipRecipeFunctions - Skips CraftTweaker/RecipeStages recipes with recipe functions before AE2 PatternHelper validation, avoiding CT FATAL spam from synthetic diagnostic inventories.
gpom.ae2.patternDiagnostics.skipRecipeFunctions=true

# == AE2 QoL ==
# Small client-side AE2 interaction fixes. These remain no-op unless the matching optional mod is installed.
# gpom.mouseTweaks.ae2Terminals.enabled - Lets Mouse Tweaks' hold-left-click item movement operate in AE2 ME terminals by enabling AE2's own Mouse Tweaks API hook only for terminal storage slots and player inventory slots.
gpom.mouseTweaks.ae2Terminals.enabled=false

# == JEC QoL ==
# Small client-side Just Enough Calculation interaction fixes. These remain no-op unless JEC is installed.
# gpom.jecalculation.pinnedCraftOverlay.enabled - Adds a client-only pinned Just Enough Calculation craft overlay to normal container screens, with a GPOM pin toggle on JEC's craft screen. No-ops when JEC is absent.
gpom.jecalculation.pinnedCraftOverlay.enabled=false
# gpom.jecalculation.fuzzyVolatileItemNbt.enabled - Lets JEC match saved recipe outputs with volatile item NBT or Forge capability payloads, fixing calculator misses for charged/capability-backed outputs such as jetpacks.
gpom.jecalculation.fuzzyVolatileItemNbt.enabled=false

# == JourneyMap QoL ==
# Small client-side JourneyMap interaction fixes. These remain no-op unless JourneyMap is installed.
# gpom.journeymap.waypointDimensionDropup.enabled - Replaces JourneyMap's waypoint-manager dimension cycling button with a scrollable dropup selector. No-op when JourneyMap is absent.
gpom.journeymap.waypointDimensionDropup.enabled=false

# == Compatibility Fixes ==
# Small exact-version safety fixes for known thread-safety or lifecycle issues exposed by modern render/loading stacks.
# gpom.loliasm.threadSafeStatefulRegistry - Replaces LoliASM's crash-state registry with a concurrent set and prunes cleared weak references from BufferBuilder churn.
gpom.loliasm.threadSafeStatefulRegistry=true
# gpom.betterPortals.fixMissingNewTarget - Patches BetterPortals' legacy EntityRenderer @At("NEW") mixin metadata with an explicit Frustum target on newer Mixin runtimes.
gpom.betterPortals.fixMissingNewTarget=true
# gpom.betterPortals.remapLegacyAetherBridge - Remaps BetterPortals' optional Aether bridge from the old com.legacy.aether package to the installed com.gildedgames.the_aether package when needed, including Aether's Skyroot-water portal activation path.
gpom.betterPortals.remapLegacyAetherBridge=true
# gpom.betterPortals.skipLegacyAetherBridgeIfMissing - Skips BetterPortals' optional Aether bridge when neither its legacy Aether target nor GPOM's remap target is available.
gpom.betterPortals.skipLegacyAetherBridgeIfMissing=true
# gpom.betterPortals.fixGuavaAddCallback - Patches BetterPortals' old two-argument Guava Futures.addCallback helper calls to the executor-taking overload required by modern Guava.
gpom.betterPortals.fixGuavaAddCallback=true
# gpom.betterPortals.cleanupClientWorlds - Reflectively resets BetterPortals' retained client view-world registry on client world handoffs and disconnects. Experimental; keep false unless debugging retained BetterPortals client worlds.
gpom.betterPortals.cleanupClientWorlds=false
# gpom.betterPortals.journeymapWaypointTeleportTransition - Routes JourneyMap cross-dimensional waypoint teleports through BetterPortals' dimension-transition handler so the configured transition animation plays. Falls back to JourneyMap's original teleport when BetterPortals is absent or declines the transfer.
gpom.betterPortals.journeymapWaypointTeleportTransition=true
# gpom.architecturecraft.fastShapeLighting - Uses brightness lighting instead of ArchitectureCraft's per-vertex ambient occlusion for shape chunk rebuilds. This reduces rebuild cost for dense shape builds at the cost of flatter lighting. Automatically skipped when AUSM is installed.
gpom.architecturecraft.fastShapeLighting=true
# gpom.architecturecraft.accurateHitboxes - Replaces ArchitectureCraft shape ray tracing with a GPOM-safe collision-box ray trace and preserves the selected sub-box for outlines. No-op when ArchitectureCraft is absent.
gpom.architecturecraft.accurateHitboxes=true
# gpom.architecturecraft.parentMaterialOcclusion.enabled - Lets ArchitectureCraft shapes answer side-render checks as their base material. Experimental; disabled by default because it can over-darken ambient occlusion on partial framed geometry.
gpom.architecturecraft.parentMaterialOcclusion.enabled=false
# gpom.blockcraftery.accurateHitboxes - Adds optional Blockcraftery ray-hitbox fixes for editable slants, corners, and copied-block cubes. No-op when Blockcraftery is absent.
gpom.blockcraftery.accurateHitboxes=true
# gpom.blockcraftery.parentMaterialOcclusion.enabled - Lets Blockcraftery copied-block cubes answer side-render and side-occlusion checks as their copied material, matching adjacent copied translucent/solid block culling. Disable only if a copied block has broken side-render logic.
gpom.blockcraftery.parentMaterialOcclusion.enabled=true
# gpom.blockcraftery.modelRenderLayerCompat - Rewrites Blockcraftery copied-block model layer checks to use Forge canRenderInLayer. Automatically skipped when AUSM is installed, because AUSM owns shader render-layer routing.
gpom.blockcraftery.modelRenderLayerCompat=true
# gpom.journeymap.cleanupLeaks - Reflectively clears JourneyMap client world/task/chunk/render caches on client world unload and disconnect. No-op when JourneyMap is absent.
gpom.journeymap.cleanupLeaks=true
# gpom.journeymap.cleanupLeaksOnDimensionHandoff - Also runs JourneyMap's full reflective leak cleanup during ordinary client dimension handoffs. Disabled by default because the purge is synchronous and can stall death/respawn dimension switches.
gpom.journeymap.cleanupLeaksOnDimensionHandoff=false
# gpom.scannable.skipRedundantConfigOreCacheRebuilds - Skips Scannable's expensive ore lookup rebuild when the server sends settings identical to the client settings already applied.
gpom.scannable.skipRedundantConfigOreCacheRebuilds=true
# gpom.enderio.repairMissingTileEntityMappings - After EnderIO load, re-registers missing vanilla TileEntity class-to-id mappings from EnderIO's own tile enum metadata. No-op when EnderIO is absent or mappings are already present.
gpom.enderio.repairMissingTileEntityMappings=true
# gpom.registry.ignoreMissingSoundEventNamespaces - Comma-separated namespaces whose stale missing SoundEvent world mappings are ignored instead of opening Forge's missing-mapping confirmation gate.
gpom.registry.ignoreMissingSoundEventNamespaces=erebus

# == Railcraft Deferrals ==
# Exact-version startup deferrals for Railcraft 12.1.0-beta-8 module/container initialization.
# gpom.railcraftLazyItemConditions - Defers Railcraft item condition initialization until first use instead of during module setup.
gpom.railcraftLazyItemConditions=true
# gpom.railcraft.deferModuleIC2Containers - Defers Railcraft IC2 container setup that otherwise forces expensive cross-mod class initialization.
gpom.railcraft.deferModuleIC2Containers=true
# gpom.railcraft.deferModuleContainers - Defers broad Railcraft module container creation until the containers are actually requested.
gpom.railcraft.deferModuleContainers=true
# gpom.railcraft.deferSelectedModuleContainers - Defers only module containers listed in gpom.railcraft.deferModuleContainerAllowlist.
gpom.railcraft.deferSelectedModuleContainers=true
