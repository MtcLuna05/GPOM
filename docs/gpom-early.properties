gpom.crafttweaker.parallelScriptParsing.batchAllowedScripts=true
# gpom.crafttweaker.parallelScriptParsing.deepProbes - Adds aggregated timing probes around CraftTweaker script source read, parse, compile, module creation, execution, and script load events.
