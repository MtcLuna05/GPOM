# General Purpose Optimization Mod early-loading config.
# Generated comments describe each section and each value; comments were regenerated while preserving configured values.

# == File Format ==
# This file is loaded before Forge's normal config system exists. Comma lists accept mod ids unless noted; '*' means every candidate; denylist entries always win.
# fml.parallel.workers - Shared worker-count fallback for all threaded FML phases. 0 lets GPOM choose a bounded value from CPU and memory.
fml.parallel.workers=0

# == Construction Parallelism ==
# Controls FMLConstructionEvent worker dispatch. This is the most fragile phase because mod instances, proxies, and automatic subscribers are created here.
# fml.parallel.construct.enabled - Enables worker dispatch for FMLConstructionEvent handlers that pass the allowlist and denylist filters.
fml.parallel.construct.enabled=true
# fml.parallel.construct.workers - Worker count for construction. 0 inherits fml.parallel.workers, then automatic sizing if the shared value is also 0.
fml.parallel.construct.workers=0
# fml.parallel.construct.allowlist - Comma-separated mod ids allowed to run construction off-thread; '*' allows every loaded mod before denylist filtering.
fml.parallel.construct.allowlist=*
# fml.parallel.construct.denylist - Comma-separated mod ids forced back to the main thread during construction; entries here override the allowlist.
fml.parallel.construct.denylist=advancedrocketry,advancedrocketrycore,ausm,betterportals,codechickenlib,enderiomachines,enderutilities,renderlib,gpom,gunpowderlib,iceandfire,ichunutil,holoinventory,immersivepetroleum,incontrol,thaumcraft,enderio,enderiobase,enderioconduits,enderioconduitsappliedenergistics,enderioconduitsopencomputers,enderioconduitsrefinedstorage,enderiointegrationforestry,enderiointegrationtic,enderiointegrationticlate,enderioinvpanel,enderiopowertools,enderioendergy,aether_legacy,forgemultipartcbe,minecraftmultipartcbe,microblockcbe,mrtjpcore
# fml.parallel.construct.continueOnModError - Diagnostic-only mode that records a construction failure and keeps scheduling later mods. Use false for normal play.
fml.parallel.construct.continueOnModError=false
# fml.parallel.construct.dag.enabled - Uses dependency-aware scheduling for Construction. Serial construction handlers remain list-order barriers for safety.
fml.parallel.construct.dag.enabled=true

# == PreInit Parallelism ==
# Controls FMLPreInitializationEvent worker dispatch. This phase touches registries, model loaders, configs, and client resource setup, so use tested allowlists.
# fml.parallel.preInit.enabled - Enables worker dispatch for FMLPreInitializationEvent handlers that pass the allowlist and denylist filters.
fml.parallel.preInit.enabled=true
# fml.parallel.preInit.workers - Worker count for PreInit. 0 inherits fml.parallel.workers, then automatic sizing if the shared value is also 0.
fml.parallel.preInit.workers=0
# fml.parallel.preInit.allowlist - Comma-separated mod ids allowed to run PreInit off-thread; '*' allows every loaded mod before denylist filtering.
fml.parallel.preInit.allowlist=*
# fml.parallel.preInit.denylist - Comma-separated mod ids forced back to the main thread during PreInit; entries here override the allowlist.
fml.parallel.preInit.denylist=tconstruct,betterportals,smoothfont,natura,ae2ctl,thaumcraft,ausm,buildcraftcore,avaritia,betterquesting,botania,bloodmagic,advancedrocketry,immersiveengineering,immersivepetroleum,openblocks,buildcraftlib,buildcraftbuilders,buildcraftenergy,buildcraftfactory,buildcraftsilicon,buildcrafttransport,buildcraftcompat,thermaldynamics,iceandfire,moartinkers,wrcbe,thebetweenlands,enderio,enderiobase,enderioconduits,enderioconduitsappliedenergistics,enderioconduitsopencomputers,enderioconduitsrefinedstorage,enderiointegrationforestry,enderiointegrationtic,enderiointegrationticlate,enderioinvpanel,enderiomachines,enderiopowertools,enderioendergy,erebus,extracells,draconicevolution,aether_legacy,binniecore,binniedesign,genetics,botany,extrabees,extratrees,gendustry,simplyjetpacks,projectred-core,projectred-illumination,projectred-compat,projectred-integration,projectred-transmission,projectred-fabrication,projectred-expansion,projectred-relocation,projectred-transportation,projectred-exploration,codechickenlib,forgemultipartcbe,minecraftmultipartcbe,microblockcbe,mrtjpcore
# fml.parallel.preInit.continueOnModError - Diagnostic-only mode that records a PreInit failure and keeps scheduling later mods. Use false for normal play.
fml.parallel.preInit.continueOnModError=false
# fml.parallel.preInit.dag.enabled - Uses dependency-aware scheduling for PreInit instead of strict list order. Experimental until missing-registry behavior is retested.
fml.parallel.preInit.dag.enabled=true

# == Init Parallelism ==
# Controls FMLInitializationEvent worker dispatch. Mods that create OpenGL objects, textures, shaders, or shared global state should stay denied.
# fml.parallel.init.enabled - Enables worker dispatch for FMLInitializationEvent handlers that pass the allowlist and denylist filters.
fml.parallel.init.enabled=true
# fml.parallel.init.workers - Worker count for Init. 0 inherits fml.parallel.workers, then automatic sizing if the shared value is also 0.
fml.parallel.init.workers=0
# fml.parallel.init.allowlist - Comma-separated mod ids allowed to run Init off-thread; '*' allows every loaded mod before denylist filtering.
fml.parallel.init.allowlist=*
# fml.parallel.init.denylist - Comma-separated mod ids forced back to the main thread during Init; entries here override the allowlist.
fml.parallel.init.denylist=betterportals,forestry,railcraft,lemonskin,enderio,enderiobase,enderioconduits,enderioconduitsappliedenergistics,enderioconduitsopencomputers,enderioconduitsrefinedstorage,enderiointegrationforestry,enderiointegrationtic,enderiointegrationticlate,enderioinvpanel,enderiomachines,enderiopowertools,enderioendergy,codechickenlib,forgemultipartcbe,minecraftmultipartcbe,microblockcbe,mrtjpcore
# fml.parallel.init.continueOnModError - Diagnostic-only mode that records an Init failure and keeps scheduling later mods. Use false for normal play.
fml.parallel.init.continueOnModError=false
# fml.parallel.init.dag.enabled - Uses dependency-aware scheduling for Init instead of strict list order, while keeping denied handlers on the main thread.
fml.parallel.init.dag.enabled=true

# == PostInit Parallelism ==
# Controls FMLPostInitializationEvent worker dispatch. Usually safer than PreInit/Init, but recipe mutation and render integration still need pack validation.
# fml.parallel.postInit.enabled - Enables worker dispatch for FMLPostInitializationEvent handlers that pass the allowlist and denylist filters.
fml.parallel.postInit.enabled=true
# fml.parallel.postInit.workers - Worker count for PostInit. 0 inherits fml.parallel.workers, then automatic sizing if the shared value is also 0.
fml.parallel.postInit.workers=0
# fml.parallel.postInit.allowlist - Comma-separated mod ids allowed to run PostInit off-thread; '*' allows every loaded mod before denylist filtering.
fml.parallel.postInit.allowlist=*
# fml.parallel.postInit.denylist - Comma-separated mod ids forced back to the main thread during PostInit; entries here override the allowlist.
fml.parallel.postInit.denylist=smoothfont,projecte,cyclopscore,integrateddynamics,integrateddynamicscompat,integratednbt,integratedtunnels,integratedtunnelscompat,enderio,enderiobase,enderioconduits,enderioconduitsappliedenergistics,enderioconduitsopencomputers,enderioconduitsrefinedstorage,enderiointegrationforestry,enderiointegrationtic,enderiointegrationticlate,enderioinvpanel,enderiomachines,enderiopowertools,enderioendergy,codechickenlib,forgemultipartcbe,minecraftmultipartcbe,microblockcbe,mrtjpcore
# fml.parallel.postInit.continueOnModError - Diagnostic-only mode that records a PostInit failure and keeps scheduling later mods. Use false for normal play.
fml.parallel.postInit.continueOnModError=false
# fml.parallel.postInit.dag.enabled - Uses dependency-aware scheduling for PostInit so independent later handlers can run while main-thread-only handlers execute.
fml.parallel.postInit.dag.enabled=true

# == LoadComplete Parallelism ==
# Controls FMLLoadCompleteEvent worker dispatch. This is the safest lifecycle phase, but HEI/JER and client-global mods can still serialize the wall time.
# fml.parallel.loadComplete.enabled - Enables worker dispatch for FMLLoadCompleteEvent handlers that pass the allowlist and denylist filters.
fml.parallel.loadComplete.enabled=true
# fml.parallel.loadComplete.workers - Worker count for LoadComplete. 0 inherits fml.parallel.workers, then automatic sizing if the shared value is also 0.
fml.parallel.loadComplete.workers=0
# fml.parallel.loadComplete.allowlist - Comma-separated mod ids allowed to run LoadComplete off-thread; '*' allows every loaded mod before denylist filtering.
fml.parallel.loadComplete.allowlist=*
# fml.parallel.loadComplete.denylist - Comma-separated mod ids forced back to the main thread during LoadComplete; entries here override the allowlist.
fml.parallel.loadComplete.denylist=betterportals,betterquesting,cofhcore,crafttweaker,iceandfire,jei,jeresources,journeymap,scannable,thaumicaugmentation,thebetweenlands,topaddons,enderio,enderiobase,enderioconduits,enderioconduitsappliedenergistics,enderioconduitsopencomputers,enderioconduitsrefinedstorage,enderiointegrationforestry,enderiointegrationtic,enderiointegrationticlate,enderioinvpanel,enderiomachines,enderiopowertools,enderioendergy,codechickenlib,forgemultipartcbe,minecraftmultipartcbe,microblockcbe,mrtjpcore
# fml.parallel.loadComplete.continueOnModError - Diagnostic-only mode that records a LoadComplete failure and keeps scheduling later mods. Use false for normal play.
fml.parallel.loadComplete.continueOnModError=false
# fml.parallel.loadComplete.dag.enabled - Uses dependency-aware scheduling for LoadComplete, including independent lookahead around long main-thread handlers such as HEI.
fml.parallel.loadComplete.dag.enabled=true

# == Thread Safety Guards ==
# Global safety switches used by the lifecycle scheduler while phases are running in workers.
# fml.parallel.registrySerialization.enabled - Serializes Forge registry writes while lifecycle workers are active to avoid HashBiMap and ForgeRegistry concurrent mutation.
fml.parallel.registrySerialization.enabled=true
# fml.parallel.clientLifecycleOpenGlScan.enabled - Keeps PreInit/Init/PostInit/LoadComplete handlers on the main thread when their mod jar references LWJGL/OpenGL/Input bytecode. This preserves client thread affinity without editing denylists.
fml.parallel.clientLifecycleOpenGlScan.enabled=true
# fml.parallel.autoQuarantineGlErrors.enabled - Diagnostic helper that appends catchable OpenGL thread offenders to the relevant phase denylist for the next launch.
fml.parallel.autoQuarantineGlErrors.enabled=false
# fml.parallel.autoQuarantineGlErrors.includeRelatedMods - When auto-quarantining, also deny likely dependent/related mods so the next launch moves the whole cluster back to main thread.
fml.parallel.autoQuarantineGlErrors.includeRelatedMods=false

# == GPOM Logging ==
# Controls GPOM's own logger and high-volume categories. Keep the root logger enabled when diagnostics such as world lifecycle snapshots are needed.
# gpom.logging.enabled - Master switch for GPOM's own logger. If false, GPOM diagnostics including WorldLifecycle lines are suppressed.
gpom.logging.enabled=false
# gpom.logging.fmlScheduler.enabled - Enables lifecycle scheduler status lines such as worker waits, phase transitions, and serialized fallback notices.
gpom.logging.fmlScheduler.enabled=true
# gpom.logging.optimizationInfo.enabled - Enables one-time informational lines from optimization installers and exact-version fast paths.
gpom.logging.optimizationInfo.enabled=true
# gpom.logging.cacheInfo.enabled - Enables cache hit, miss, invalidation, and persistence lines for GPOM input-validated caches.
gpom.logging.cacheInfo.enabled=true
# gpom.logging.asyncProbeLogs.enabled - Moves high-volume GPOM probe/profiler log writes onto a bounded daemon thread so console/file IO does not stall gameplay.
gpom.logging.asyncProbeLogs.enabled=false
# gpom.logging.asyncProbeLogs.queueSize - Maximum queued GPOM probe log lines before excess probe logs are dropped instead of blocking the caller.
gpom.logging.asyncProbeLogs.queueSize=32768

# gpom.vintageFix.suppressUcwModelErrorSpam - Suppresses repeated VintageFix model retrieval stack traces after replacing them with one short GPOM notice per failing model namespace.
gpom.vintageFix.suppressUcwModelErrorSpam=true
# gpom.vintageFix.skipUcwDefinitionEarlyModelLoad - Prevents VintageFix from treating Unlimited Chisel Works ucwdefs JSON files as real model JSON during early dynamic model discovery.
gpom.vintageFix.skipUcwDefinitionEarlyModelLoad=true

# == Startup Profiler Logs ==
# Controls how much startup timing data GPOM emits. Disabling logs does not disable the underlying optimized code paths.
# gpom.startupProfiler.logs.enabled - Master switch for startup profiler log output. Timings may still be collected for UI or summaries.
gpom.startupProfiler.logs.enabled=false
# gpom.startupProfiler.logs.boot.enabled - Logs early boot/profiler setup markers.
gpom.startupProfiler.logs.boot.enabled=false
# gpom.startupProfiler.logs.phaseLifecycle.enabled - Logs lifecycle phase start, end, and wall-time markers.
gpom.startupProfiler.logs.phaseLifecycle.enabled=false
# gpom.startupProfiler.logs.modDetails.enabled - Logs per-mod lifecycle timings and wait attribution details.
gpom.startupProfiler.logs.modDetails.enabled=false
# gpom.startupProfiler.logs.phaseSummary.enabled - Logs per-phase top sink summaries.
gpom.startupProfiler.logs.phaseSummary.enabled=false
# gpom.startupProfiler.logs.phaseDigest.enabled - Logs compact phase digest lines intended for quick comparison between launches.
gpom.startupProfiler.logs.phaseDigest.enabled=false
# gpom.startupProfiler.logs.memoryDetails.enabled - Logs memory snapshots attached to startup phases and selected probes.
gpom.startupProfiler.logs.memoryDetails.enabled=false
# gpom.startupProfiler.logs.probes.enabled - Logs raw high-volume probe events from targeted deep profilers.
gpom.startupProfiler.logs.probes.enabled=false
# gpom.startupProfiler.logs.probeSummary.enabled - Logs aggregated probe summaries without the full raw probe stream.
gpom.startupProfiler.logs.probeSummary.enabled=false
# gpom.startupProfiler.logs.wallDiagnostics.enabled - Logs wall-clock diagnostics that explain dead time, waits, and scheduler under-utilization.
gpom.startupProfiler.logs.wallDiagnostics.enabled=false
# gpom.startupProfiler.logs.stackSamples.enabled - Logs stack-sample diagnostics for long-running startup sinks.
gpom.startupProfiler.logs.stackSamples.enabled=false
# gpom.startupProfiler.logs.resourceLoadOrder.enabled - Logs resource/model load-order diagnostics used to locate client-side loading stalls.
gpom.startupProfiler.logs.resourceLoadOrder.enabled=false
# gpom.startupProfiler.probeLogs.enabled - Compatibility alias for older configs; false also disables raw [Probe] startup lines.
gpom.startupProfiler.probeLogs.enabled=false
gpom.startupProfiler.probeHighVolumeEventBusPosts=false
# gpom.startupProfiler.topCount - Number of top mods/probes included in startup profiler summaries.
gpom.startupProfiler.topCount=40
# gpom.startupProfiler.postPreInitProgressBars - Shows a coarse Forge loading bar during the long post-PreInit registry transition.
gpom.startupProfiler.postPreInitProgressBars=true

# == Client Loading UI ==
# Optional client-only UI additions for early startup, world entry, and the main menu startup time display.
# gpom.earlySplash.enabled - Shows GPOM's isolated early splash window before Minecraft creates its own display.
gpom.earlySplash.enabled=true
# gpom.earlySplash.packName - Display label shown on the early splash window footer.
gpom.earlySplash.packName=MeatballCraft
# gpom.worldLoadingScreen.enabled - Shows GPOM's passive world-entry overlay during blank or early-0% world join periods.
gpom.worldLoadingScreen.enabled=true
# gpom.mainMenuStartupTime.enabled - Adds the last measured startup duration to the GPOM branding text on the main menu.
gpom.mainMenuStartupTime.enabled=true

# == World Lifecycle Profiling ==
# World load, unload, and dimension-switch diagnostics for tracking retained client state and memory leaks.
# gpom.worldLifecycleProfiler.enabled - Logs client world load, unload, and dimension-switch memory/state snapshots.
gpom.worldLifecycleProfiler.enabled=false
# gpom.worldLifecycleProfiler.forceGcBeforeSnapshots - Runs System.gc() before delayed world lifecycle snapshots to make retained-memory trends easier to see.
gpom.worldLifecycleProfiler.forceGcBeforeSnapshots=false
# gpom.worldLifecycleProfiler.delayedSnapshotMillis - Comma-separated delayed snapshot times after each world transition; include values below 30000 for fast switch testing.
gpom.worldLifecycleProfiler.delayedSnapshotMillis=2000,10000,25000
# gpom.worldLifecycleProfiler.deepAttribution.enabled - Logs detailed texture, resource-manager, and renderer ownership summaries for world memory leak attribution.
gpom.worldLifecycleProfiler.deepAttribution.enabled=false
# gpom.worldLifecycleProfiler.deepAttribution.maxEntries - Maximum entries shown in each WorldLifecycleDeep top-list; higher values increase log volume.
gpom.worldLifecycleProfiler.deepAttribution.maxEntries=10

# == Compatibility Fixes ==
# Small exact-version safety fixes for known thread-safety or lifecycle issues exposed by modern render/loading stacks.
# gpom.loliasm.threadSafeStatefulRegistry - Replaces LoliASMs crash-state registry with a concurrent set and prunes cleared weak references from BufferBuilder churn.
gpom.loliasm.threadSafeStatefulRegistry=true

# == Railcraft Deferrals ==
# Exact-version startup deferrals for Railcraft 12.1.0-beta-8 module/container initialization.
# gpom.railcraftLazyItemConditions - Defers Railcraft item condition initialization until first use instead of during module setup.
gpom.railcraftLazyItemConditions=true
# gpom.railcraft.deferModuleIC2Containers - Defers Railcraft IC2 container setup that otherwise forces expensive cross-mod class initialization.
gpom.railcraft.deferModuleIC2Containers=true
# gpom.railcraft.deferModuleContainers - Defers broad Railcraft module container creation until the containers are actually requested.
gpom.railcraft.deferModuleContainers=false
# gpom.railcraft.deferSelectedModuleContainers - Defers only module containers listed in gpom.railcraft.deferModuleContainerAllowlist.
gpom.railcraft.deferSelectedModuleContainers=false
# gpom.railcraft.deferModuleContainerAllowlist - Comma-separated Railcraft module class names eligible for selected container deferral.
gpom.railcraft.deferModuleContainerAllowlist=
# gpom.railcraft.lazyCartConfig - Defers Railcraft cart config materialization until cart settings are first queried.
gpom.railcraft.lazyCartConfig=true

# == General Startup Optimizations ==
# Exact-version or input-validated startup shortcuts outside HEI. Disable a key to fall back to the original mod behavior.
# gpom.astralSorcery.deferAssetLibraryReload - Registers Astral Sorcery's asset reload listener without forcing immediate texture preload during PreInit.
gpom.astralSorcery.deferAssetLibraryReload=true
# gpom.agricraft.fastJsonIo - Uses the AgriCraft exact-version fast JSON IO path while preserving parsed content.
gpom.agricraft.fastJsonIo=true
# gpom.agricraft.fastResourceScan - Avoids redundant AgriCraft resource scans when the same candidate set has already been resolved.
gpom.agricraft.fastResourceScan=true
# gpom.agricraft.skipJsonWriteback - Skips AgriCraft's startup rewrite of unchanged/default JSON files.
gpom.agricraft.skipJsonWriteback=true
# gpom.openComputersSettingsCache - Caches OpenComputers settings construction and invalidates on bundled/user config byte changes.
gpom.openComputersSettingsCache=true
# gpom.openComputers.fastLuaSelection - Avoids probing disabled Lua native backends before OpenComputers architecture registration.
gpom.openComputers.fastLuaSelection=true
# gpom.openComputersCallProfiler - Enables targeted OpenComputers call timing probes for startup investigation.
gpom.openComputersCallProfiler=false
# gpom.openComputersIntegrationProfiler - Enables targeted OpenComputers integration timing probes for startup investigation.
gpom.openComputersIntegrationProfiler=false
# gpom.gendustryConfigCache - Caches Gendustry tuning/config parsing and invalidates when bundled or user config bytes change.
gpom.gendustryConfigCache=true
# gpom.gendustryCallProfiler - Enables targeted Gendustry startup timing probes.
gpom.gendustryCallProfiler=false
# gpom.erebus.deferComposterRegistry - Defers Erebus composter registry materialization until first compostability query.
gpom.erebus.deferComposterRegistry=true
# gpom.erebus.deferOreConfigs - Defers Erebus ore config enum materialization until an ore setting is first used.
gpom.erebus.deferOreConfigs=true
# gpom.enderio.fastSpawnerEntityValidation - Caches EnderIO powered-spawner XML entity validation during core recipe loading.
gpom.enderio.fastSpawnerEntityValidation=true
# gpom.crafttweaker.fastZenRegister - Uses ASMData to register CraftTweaker ZenRegister classes without reflective annotation scans.
gpom.crafttweaker.fastZenRegister=true
# gpom.crafttweaker.fastZenRegister.parallelClassLoad - Defines CT ZenRegister classes on bounded worker threads, then keeps registry writes serial.
gpom.crafttweaker.fastZenRegister.parallelClassLoad=true
# gpom.crafttweaker.fastZenRegister.classLoadWorkers - Worker count for CT fast ZenRegister class loading.
gpom.crafttweaker.fastZenRegister.classLoadWorkers=4
# gpom.crafttweaker.fastZenRegister.deepProbes - Adds aggregate timing around CT ZenRegister class load, mod filters, and global registry writes.
gpom.crafttweaker.fastZenRegister.deepProbes=false
# gpom.crafttweaker.lazyItemList - Defers CraftTweaker's regex item-list build until the regex item APIs are actually used.
gpom.crafttweaker.lazyItemList=true
gpom.crafttweaker.suppressFunctionTypeStdout=true
# gpom.crafttweaker.parallelScriptParsing.enabled - Enables CraftTweaker script-loading acceleration inside each priority bucket while preserving sorted compile and execution order.
gpom.crafttweaker.parallelScriptParsing.enabled=true
# gpom.crafttweaker.parallelScriptParsing.workers - Worker count for CraftTweaker script source preloading or aggressive off-thread Zen parsing. 0 lets GPOM choose a bounded automatic value.
gpom.crafttweaker.parallelScriptParsing.workers=0
# gpom.crafttweaker.parallelScriptParsing.allowlist - Comma-separated CraftTweaker script names allowed to use the accelerated path; * allows all before denylist filtering.
gpom.crafttweaker.parallelScriptParsing.allowlist=*
# gpom.crafttweaker.parallelScriptParsing.denylist - Comma-separated CraftTweaker script names forced back to stock serial source-open and parse behavior.
gpom.crafttweaker.parallelScriptParsing.denylist=PeriodicTable.zs
# gpom.crafttweaker.parallelScriptParsing.offThreadZenParse - If true, runs ZenParsedFile parsing on workers on the client. Dedicated-server launches force this off; server bootstrap transformers are not worker-safe.
gpom.crafttweaker.parallelScriptParsing.offThreadZenParse=true
# gpom.crafttweaker.parallelScriptParsing.suppressGlobalDebugCompileLogs - Suppresses global CT debug compile chatter while keeping per-script debug and errors.
gpom.crafttweaker.parallelScriptParsing.suppressGlobalDebugCompileLogs=true
# gpom.crafttweaker.parallelScriptParsing.batchAllowedScripts - Batch accelerated same-priority scripts while preserving order.
gpom.crafttweaker.parallelScriptParsing.batchAllowedScripts=true
# gpom.crafttweaker.parallelScriptParsing.deepProbes - Adds aggregated timing probes around CT script read/parse/compile/execute.
gpom.crafttweaker.parallelScriptParsing.deepProbes=false
# gpom.nuclearcraft.fastManufactoryMetalRecipes - Uses a cached ore-name set for NuclearCraft Manufactory metal recipe registration with stock fallback.
gpom.nuclearcraft.fastManufactoryMetalRecipes=true
# gpom.nuclearcraft.cacheManufactoryLogCraftingResults - Caches NuclearCraft Manufactory log-to-plank crafting lookups and narrows misses to one-slot recipes before stock fallback.
gpom.nuclearcraft.cacheManufactoryLogCraftingResults=true
# gpom.preInitHighSinkCallProfiler - Enables exact-version deep PreInit profilers for current high-sink mods.
gpom.preInitHighSinkCallProfiler=false
# gpom.postPreInitTopCallProfiler - Enables exact-version deep post-PreInit registry-transition profilers for current high-sink handlers.
gpom.postPreInitTopCallProfiler=false

# == PreInit Class Prewarm ==
# Optional sidecar class definition/linking during PreInit. Static initialization is disabled by default because it can execute mod code early.
# gpom.preInitClassPrewarm.enabled - Starts the optional PreInit class prewarm sidecar for allowlisted mods.
gpom.preInitClassPrewarm.enabled=true
# gpom.preInitClassPrewarm.allowlist - Comma-separated mod ids allowed to prewarm classes; '*' allows every mod before other limits apply.
gpom.preInitClassPrewarm.allowlist=*
# gpom.preInitClassPrewarm.workers - Number of sidecar class-prewarm workers. Values below 1 are clamped to 1.
gpom.preInitClassPrewarm.workers=2
# gpom.preInitClassPrewarm.deferMinCompletedHandlers - Minimum completed PreInit handlers before the sidecar may begin deferred work.
gpom.preInitClassPrewarm.deferMinCompletedHandlers=0
# gpom.preInitClassPrewarm.deferUntilSerialMillis - Minimum serial PreInit elapsed time before deferred class prewarming can start.
gpom.preInitClassPrewarm.deferUntilSerialMillis=0
# gpom.preInitClassPrewarm.pauseDuringSerialHandlers - Pauses sidecar prewarming while main-thread serial PreInit handlers are running.
gpom.preInitClassPrewarm.pauseDuringSerialHandlers=true
# gpom.preInitClassPrewarm.pauseDuringBlockingWaits - Pauses sidecar prewarming while the scheduler is blocked waiting for unsafe or serialized work.
gpom.preInitClassPrewarm.pauseDuringBlockingWaits=true
# gpom.preInitClassPrewarm.maxClassesPerMod - Maximum class names GPOM will consider per mod for prewarming.
gpom.preInitClassPrewarm.maxClassesPerMod=1024
# gpom.preInitClassPrewarm.chunkSize - Number of class names processed per prewarm work chunk.
gpom.preInitClassPrewarm.chunkSize=64
# gpom.preInitClassPrewarm.includeAnonClasses - Includes anonymous and synthetic-looking classes in the prewarm candidate list.
gpom.preInitClassPrewarm.includeAnonClasses=true
# gpom.preInitClassPrewarm.extraPrefixes - Extra prewarm package prefixes, formatted modid:internal/prefix|other/prefix;modid2:prefix.
gpom.preInitClassPrewarm.extraPrefixes=
# gpom.preInitClassPrewarm.noInitAllowlist - Mod ids that use Class.forName(..., false) with the built-in no-static-init prefix table.
gpom.preInitClassPrewarm.noInitAllowlist=*
# gpom.preInitClassPrewarm.noInitPrefixes - Extra no-static-init prefixes, formatted modid:internal/prefix|other/prefix;modid2:prefix.
gpom.preInitClassPrewarm.noInitPrefixes=erebus:erebus/entity/|erebus/client/render/entity/;deepmoblearning:mustapelto/deepmoblearning/
# gpom.preInitClassPrewarm.initializeClasses - Allows static initializers during explicit class prewarm. Risky; keep false unless testing a precise class list.
gpom.preInitClassPrewarm.initializeClasses=true
# gpom.preInitClassPrewarm.initializeAllowlist - Comma-separated mod ids whose scanned prewarm classes may run static initializers. Overrides the safe no-init bucket only for listed mods.
gpom.preInitClassPrewarm.initializeAllowlist=*
# gpom.preInitClassPrewarm.explicitClasses - Explicit class names to prewarm, formatted modid:pkg.Class|other.Class;modid2:pkg.Class.
gpom.preInitClassPrewarm.explicitClasses=railcraft:mods.railcraft.common.blocks.RailcraftBlocks|mods.railcraft.common.carts.RailcraftCarts|mods.railcraft.common.items.RailcraftItems|mods.railcraft.common.blocks.tracks.outfitted.TrackKits;twilightforest:twilightforest.TFFeature

# == HEI Progress And Search ==
# HEI client startup helpers that keep recipe ingestion visible and replace the single search worker with a bounded pool.
# gpom.hei.recipeProgressBar.enabled - Shows a coarse GPOM progress bar while HEI consumes parsed recipes into its registry.
gpom.hei.recipeProgressBar.enabled=true
# gpom.hei.recipeProgressBar.stepSize - Number of HEI recipe registrations between progress updates.
gpom.hei.recipeProgressBar.stepSize=256
# gpom.hei.searchWorkers - Worker count for HEI search indexing. 0 lets GPOM choose an automatic bounded pool size.
gpom.hei.searchWorkers=1
# gpom.hei.fastPreInitPluginDiscovery.enabled - Predefines JEI plugin classes on bounded worker threads during HEI PreInit, then constructs plugin instances serially.
gpom.hei.fastPreInitPluginDiscovery.enabled=true
# gpom.hei.fastPreInitPluginDiscovery.workers - Worker count for HEI PreInit plugin class loading.
gpom.hei.fastPreInitPluginDiscovery.workers=4
# gpom.hei.fastPreInitPluginDiscovery.deepProbes - Logs aggregate timing for HEI PreInit plugin discovery.
gpom.hei.fastPreInitPluginDiscovery.deepProbes=false

# == HEI Plugin Parallelism ==
# Experimental worker dispatch for allowlisted HEI plugin registration calls. Empty allowlist means no plugin registration is threaded.
# gpom.hei.parallelPluginRegistration.enabled - Enables experimental worker dispatch for HEI IModPlugin.register calls that match the allowlist.
gpom.hei.parallelPluginRegistration.enabled=true
# gpom.hei.parallelPluginRegistration.workers - Worker count for HEI plugin registration. 0 lets GPOM choose an automatic bounded pool size.
gpom.hei.parallelPluginRegistration.workers=6
gpom.hei.parallelPluginRegistration.overlapSerial=true

# gpom.hei.parallelPluginRegistration.allowlist - Comma-separated HEI plugin class names allowed to register off-thread; '*' allows all before denylist filtering.
gpom.hei.parallelPluginRegistration.allowlist=*
# gpom.hei.parallelPluginRegistration.denylist - Comma-separated HEI plugin class names forced to register on the main thread; entries override the allowlist.
gpom.hei.parallelPluginRegistration.denylist=mezz.jei.plugins.jei.JEIInternalPlugin,mezz.jei.plugins.modsupport.ModSupportPlugin,com.l.gpom.compat.hei.GpomHeiQoLPlugin,lumien.randomthings.handler.compability.jei.RandomThingsPlugin,com.blakebr0.mysticalagradditions.compat.jei.CompatJEI

# == HEI Recipe Optimizations ==
# gpom.hei.recipeRegistryFastPaths.enabled - Enables GPOM's exact HEI RecipeRegistry fast paths. Keep disabled only when isolating recipe registration or visibility issues.
gpom.hei.recipeRegistryFastPaths.enabled=true
# gpom.hei.recipeRegistryBulkProgress.enabled - Wraps HEI RecipeRegistry bulk ingestion with GPOM progress/bulk state. Disabled by default because recipe indexing must remain stock while isolating HEI visibility bugs.
gpom.hei.recipeRegistryBulkProgress.enabled=true
# gpom.hei.recipeRegistryHandlerCache.enabled - Caches exact HEI RecipeRegistry handler lookups while preserving HEI's handler precedence.
gpom.hei.recipeRegistryHandlerCache.enabled=true
# gpom.hei.recipeRegistryKnownRuntime.enabled - Uses exact known-runtime recipe wrappers for selected mod recipe classes and falls back to HEI stock lookup on failure.
gpom.hei.recipeRegistryKnownRuntime.enabled=true
# gpom.hei.recipeRegistryNullUnhideGuard.enabled - Guards HEI unhideRecipe calls against null wrappers from broken third-party integrations.
gpom.hei.recipeRegistryNullUnhideGuard.enabled=true
# gpom.hei.recipeRegistryDeferVisibleCache.enabled - Defers HEI recipe category visible-cache clears during bulk recipe ingestion. Disabled by default because staged/progression packs can query visibility during registration.
gpom.hei.recipeRegistryDeferVisibleCache.enabled=true
# gpom.hei.recipeMapIngredientCache.enabled - Caches HEI RecipeMap ingredient-helper subtype and unique-id calls with content-keyed ItemStack/FluidStack signatures.
gpom.hei.recipeMapIngredientCache.enabled=true
# gpom.hei.recipeMapIngredientCache.maxEntries - Maximum entries retained by each HEI RecipeMap ingredient cache before the cache is cleared.
gpom.hei.recipeMapIngredientCache.maxEntries=65536

# == HEI Recipe Optimizations ==
# Exact-version HEI recipe/category fast paths and persistent wrapper caches. Caches validate input signatures before reuse.
# gpom.hei.jerVillagerTradeCache.enabled - Replaces JER's repeated random trade simulations with a reduced deterministic display cache.
gpom.hei.jerVillagerTradeCache.enabled=true
# gpom.hei.jerVillagerTradeCache.samples - Number of simulated villager-trade samples retained for JER display range approximation.
gpom.hei.jerVillagerTradeCache.samples=32
# gpom.hei.jerLootDropCache.enabled - Caches JER loot-table drop conversion results during HEI startup and returns fresh list copies to callers.
gpom.hei.jerLootDropCache.enabled=true
# gpom.hei.fastForestryBottler.enabled - Uses Forestry's exact-version Bottler HEI fast path and skips redundant full-fluid-container fill loops.
gpom.hei.fastForestryBottler.enabled=true
# gpom.hei.forestryBottlerRecipeCache.enabled - Persists Forestry Bottler HEI wrapper inputs/outputs and reuses them when item/fluid signatures match.
gpom.hei.forestryBottlerRecipeCache.enabled=true
# gpom.hei.fastEnderIOTank.enabled - Uses EnderIO's exact-version tank HEI fast path while preserving the full item list for mending recipes.
gpom.hei.fastEnderIOTank.enabled=true
# gpom.hei.extraTreesLumbermillRecipeCache.enabled - Persists ExtraTrees Lumbermill wrapper tuples and reuses them when item/recipe/log signatures match.
gpom.hei.extraTreesLumbermillRecipeCache.enabled=true
# gpom.hei.fastThermalTransposerContainers.enabled - Uses Thermal Expansion's exact-version Transposer container fast builder and drawable reuse path.
gpom.hei.fastThermalTransposerContainers.enabled=true
# gpom.hei.thermalTransposerContainerCache.enabled - Persists Thermal Transposer fill/drain wrapper lists and reuses them when container/fluid signatures match.
gpom.hei.thermalTransposerContainerCache.enabled=true

