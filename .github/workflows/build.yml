name: Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jar:
    name: Build jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon -Pgpom_use_remote_mod_deps=true build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: gpom-${{ github.sha }}
          path: |
            build/libs/gpom-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
