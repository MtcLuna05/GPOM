name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jar:
    name: Build jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon -Pgpom_use_remote_mod_deps=true build

      - name: Stage jar
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
          short_sha="${GITHUB_SHA::7}"
          mkdir -p dist
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'GPOM-*.jar' ! -name '*-sources.jar' | sort | tail -n 1)"
          if [[ -z "${jar_path}" ]]; then
            echo "No GPOM jar found in build/libs" >&2
            exit 1
          fi
          cp "${jar_path}" "dist/GPOM-${version}+${short_sha}.jar"
          cp "${jar_path}" "dist/GPOM-latest.jar"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPOM-${{ github.sha }}
          path: dist/*.jar
          if-no-files-found: error

  build-release:
    name: Publish build release
    needs: jar
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.actor == 'MtcLuna05')
    permissions:
      contents: write

    steps:
      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: GPOM-${{ github.sha }}
          path: dist

      - name: Publish versioned release jar
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/GPOM-latest.jar
          short_sha="${GITHUB_SHA::7}"
          versioned_jar="$(find dist -maxdepth 1 -type f -name "GPOM-*+${short_sha}.jar" | sort | tail -n 1)"
          if [[ -z "${versioned_jar}" ]]; then
            echo "No versioned GPOM jar found in dist" >&2
            find dist -maxdepth 1 -type f -print >&2 || true
            exit 1
          fi
          version="$(basename "${versioned_jar}")"
          version="${version#GPOM-}"
          version="${version%+${short_sha}.jar}"
          release_tag="v${version}+${short_sha}"
          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" "${versioned_jar}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${release_tag}" "${versioned_jar}" --repo "${GITHUB_REPOSITORY}" \
              --title "GPOM ${version} (${short_sha})" \
              --notes "Build from commit ${GITHUB_SHA}." \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi

      - name: Retain latest five build releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 --json tagName,createdAt,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | test("^v[0-9].*\\+[0-9a-f]{7}$"))) | [.createdAt, .tagName] | @tsv' \
            | sort -r \
            | tail -n +6 \
            | while IFS=$'\t' read -r _ tag; do
                [[ -n "${tag}" ]] || continue
                gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag
              done

      - name: Publish CurseForge file
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_CHANGELOG: Release ${{ github.sha }}
        run: |
          if [[ -z "${CURSEFORGE_PROJECT_ID}" || -z "${CURSEFORGE_TOKEN}" ]]; then
            echo "CurseForge publishing is not configured; skipping."
            exit 0
          fi
          ./gradlew --no-daemon -Pgpom_use_remote_mod_deps=true publishCurseForge
