name: Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jar:
    name: Build jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon -Pgpom_use_remote_mod_deps=true build

      - name: Stage jar
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
          short_sha="${GITHUB_SHA::7}"
          mkdir -p dist
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'GPOM-*.jar' ! -name '*-sources.jar' | sort | tail -n 1)"
          if [[ -z "${jar_path}" ]]; then
            echo "No GPOM jar found in build/libs" >&2
            exit 1
          fi
          cp "${jar_path}" "dist/GPOM-${version}+${short_sha}.jar"
          cp "${jar_path}" "dist/GPOM-latest.jar"

      - name: Publish latest release jar
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" 2>/dev/null || true
          gh release create latest dist/GPOM-latest.jar \
            --title "GPOM Latest Build" \
            --notes "Automated latest jar from master commit ${GITHUB_SHA}." \
            --prerelease \
            --target "${GITHUB_SHA}"
