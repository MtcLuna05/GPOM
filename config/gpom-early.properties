# gpom.startupProfiler.topCount - Number of top mods/probes included in startup profiler summaries.
gpom.startupProfiler.topCount=40
# gpom.startupProfiler.postPreInitProgressBars - Shows a coarse Forge loading bar during the long post-PreInit registry transition.
gpom.startupProfiler.postPreInitProgressBars=false
# gpom.startupProfiler.postPreInitProgressSteps - Step budget for the GPOM post-PreInit loading bar. Raise this if the UI reaches the maximum before the transition ends.
gpom.startupProfiler.postPreInitProgressSteps=96

