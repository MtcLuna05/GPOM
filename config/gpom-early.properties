gpom.construction.genericSidedProxies.denylist=thaumcraft,aether_legacy,architecturecraft,codechickenlib,forgemultipartcbe,minecraftmultipartcbe,microblockcbe,mrtjpcore,wrcbe,projectred-core,projectred-illumination,projectred-compat,projectred-integration,projectred-transmission,projectred-fabrication,projectred-expansion,projectred-relocation,projectred-transportation,projectred-exploration
