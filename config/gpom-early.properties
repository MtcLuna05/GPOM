gpom.construction.genericAutomaticSubscribers.denylist=thaumcraft,chisel,ctm,unlimitedchiselworks,thaumcraftfix,thebetweenlands,twilightforest,erebus,plustic,aether_legacy,superfactorymanager,dankstorage,codechickenlib,forgemultipartcbe,minecraftmultipartcbe,microblockcbe,mrtjpcore,wrcbe,projectred-core,projectred-illumination,projectred-compat,projectred-integration,projectred-transmission,projectred-fabrication,projectred-expansion,projectred-relocation,projectred-transportation,projectred-exploration,enderio,enderiobase,enderioconduits,enderioconduitsappliedenergistics,enderioconduitsopencomputers,enderioconduitsrefinedstorage,enderiointegrationforestry,enderiointegrationtic,enderiointegrationticlate,enderioinvpanel,enderiomachines,enderiopowertools,enderioendergy

