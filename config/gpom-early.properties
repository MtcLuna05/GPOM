# General Purpose Optimization Mod early-loading config.
# Generated comments describe each section and each value; delete and relaunch to regenerate this file with current defaults.

# == File Format ==
# This file is loaded before Forge's normal config system exists. Comma lists accept mod ids unless noted; '*' means every candidate; denylist entries always win.
# fml.parallel.workers - Shared worker-count fallback for all threaded FML phases. 0 lets GPOM choose a bounded value from CPU and memory.
fml.parallel.workers=0

# == Construction Parallelism ==
# Controls FMLConstructionEvent worker dispatch. This is the most fragile phase because mod instances, proxies, and automatic subscribers are created here.
# fml.parallel.construct.enabled - Enables worker dispatch for FMLConstructionEvent handlers that pass the allowlist and denylist filters.
fml.parallel.construct.enabled=true
# fml.parallel.construct.workers - Worker count for construction. 0 inherits fml.parallel.workers, then automatic sizing if the shared value is also 0.
fml.parallel.construct.workers=0
# fml.parallel.construct.allowlist - Comma-separated mod ids allowed to run construction off-thread; '*' allows every loaded mod before denylist filtering.
fml.parallel.construct.allowlist=*
# fml.parallel.construct.denylist - Comma-separated mod ids forced back to the main thread during construction; entries here override the allowlist.
fml.parallel.construct.denylist=advancedrocketry,advancedrocketrycore,ausm,betterportals,codechickenlib,enderiomachines,enderutilities,renderlib,gpom,gunpowderlib,iceandfire,ichunutil,holoinventory,immersivepetroleum,incontrol,thaumcraft,enderio,enderiobase,enderioconduits,enderioconduitsappliedenergistics,enderioconduitsopencomputers,enderioconduitsrefinedstorage,enderiointegrationforestry,enderiointegrationtic,enderiointegrationticlate,enderioinvpanel,enderiopowertools,enderioendergy,aether_legacy,forgemultipartcbe,minecraftmultipartcbe,microblockcbe,mrtjpcore,wrcbe,dankstorage
# fml.parallel.construct.continueOnModError - Diagnostic-only mode that records a construction failure and keeps scheduling later mods. Use false for normal play.
fml.parallel.construct.continueOnModError=false
# fml.parallel.construct.dag.enabled - Uses dependency-aware scheduling for Construction. Serial construction handlers remain list-order barriers for safety.
fml.parallel.construct.dag.enabled=true

# == PreInit Parallelism ==
# Controls FMLPreInitializationEvent worker dispatch. This phase touches registries, model loaders, configs, and client resource setup, so use tested allowlists.
# fml.parallel.preInit.enabled - Enables worker dispatch for FMLPreInitializationEvent handlers that pass the allowlist and denylist filters.
fml.parallel.preInit.enabled=true
# fml.parallel.preInit.workers - Worker count for PreInit. 0 inherits fml.parallel.workers, then automatic sizing if the shared value is also 0.
fml.parallel.preInit.workers=0
# fml.parallel.preInit.allowlist - Comma-separated mod ids allowed to run PreInit off-thread; '*' allows every loaded mod before denylist filtering.
fml.parallel.preInit.allowlist=*
# fml.parallel.preInit.denylist - Comma-separated mod ids forced back to the main thread during PreInit; entries here override the allowlist.
fml.parallel.preInit.denylist=tconstruct,betterportals,smoothfont,natura,ae2ctl,thaumcraft,ausm,industrialforegoing,blockcraftery,mysticallib,buildcraftcore,avaritia,betterquesting,botania,bloodmagic,advancedrocketry,immersiveengineering,immersivepetroleum,openblocks,buildcraftlib,buildcraftbuilders,buildcraftenergy,buildcraftfactory,buildcraftsilicon,buildcrafttransport,buildcraftcompat,thermaldynamics,iceandfire,moartinkers,wrcbe,thebetweenlands,enderio,enderiobase,enderioconduits,enderioconduitsappliedenergistics,enderioconduitsopencomputers,enderioconduitsrefinedstorage,enderiointegrationforestry,enderiointegrationtic,enderiointegrationticlate,enderioinvpanel,enderiomachines,enderiopowertools,enderioendergy,erebus,extracells,draconicevolution,aether_legacy,binniecore,binniedesign,genetics,botany,extrabees,extratrees,gendustry,simplyjetpacks,projectred-core,projectred-illumination,projectred-compat,projectred-integration,projectred-transmission,projectred-fabrication,projectred-expansion,projectred-relocation,projectred-transportation,projectred-exploration,codechickenlib,forgemultipartcbe,minecraftmultipartcbe,microblockcbe,mrtjpcore,actuallyadditions,extendedcrafting
# fml.parallel.preInit.continueOnModError - Diagnostic-only mode that records a PreInit failure and keeps scheduling later mods. Use false for normal play.
fml.parallel.preInit.continueOnModError=false
# fml.parallel.preInit.dag.enabled - Uses dependency-aware scheduling for PreInit instead of strict list order. Experimental until missing-registry behavior is retested.
fml.parallel.preInit.dag.enabled=true

# == Init Parallelism ==
# Controls FMLInitializationEvent worker dispatch. Mods that create OpenGL objects, textures, shaders, or shared global state should stay denied.
# fml.parallel.init.enabled - Enables worker dispatch for FMLInitializationEvent handlers that pass the allowlist and denylist filters.
fml.parallel.init.enabled=true
# fml.parallel.init.workers - Worker count for Init. 0 inherits fml.parallel.workers, then automatic sizing if the shared value is also 0.
fml.parallel.init.workers=0
# fml.parallel.init.allowlist - Comma-separated mod ids allowed to run Init off-thread; '*' allows every loaded mod before denylist filtering.
fml.parallel.init.allowlist=*
# fml.parallel.init.denylist - Comma-separated mod ids forced back to the main thread during Init; entries here override the allowlist.
fml.parallel.init.denylist=betterportals,forestry,railcraft,lemonskin,enderio,enderiobase,enderioconduits,enderioconduitsappliedenergistics,enderioconduitsopencomputers,enderioconduitsrefinedstorage,enderiointegrationforestry,enderiointegrationtic,enderiointegrationticlate,enderioinvpanel,enderiomachines,enderiopowertools,enderioendergy,codechickenlib,forgemultipartcbe,minecraftmultipartcbe,microblockcbe,mrtjpcore,wrcbe,actuallyadditions,modularmachinery,modularmachineryaddons
# fml.parallel.init.continueOnModError - Diagnostic-only mode that records an Init failure and keeps scheduling later mods. Use false for normal play.
fml.parallel.init.continueOnModError=false
# fml.parallel.init.dag.enabled - Uses dependency-aware scheduling for Init instead of strict list order, while keeping denied handlers on the main thread.
fml.parallel.init.dag.enabled=true

# == PostInit Parallelism ==
# Controls FMLPostInitializationEvent worker dispatch. Usually safer than PreInit/Init, but recipe mutation and render integration still need pack validation.
# fml.parallel.postInit.enabled - Enables worker dispatch for FMLPostInitializationEvent handlers that pass the allowlist and denylist filters.
fml.parallel.postInit.enabled=true
# fml.parallel.postInit.workers - Worker count for PostInit. 0 inherits fml.parallel.workers, then automatic sizing if the shared value is also 0.
fml.parallel.postInit.workers=0
# fml.parallel.postInit.allowlist - Comma-separated mod ids allowed to run PostInit off-thread; '*' allows every loaded mod before denylist filtering.
fml.parallel.postInit.allowlist=*
# fml.parallel.postInit.denylist - Comma-separated mod ids forced back to the main thread during PostInit; entries here override the allowlist.
fml.parallel.postInit.denylist=smoothfont,projecte,cyclopscore,integrateddynamics,integrateddynamicscompat,integratednbt,integratedtunnels,integratedtunnelscompat,enderio,enderiobase,enderioconduits,enderioconduitsappliedenergistics,enderioconduitsopencomputers,enderioconduitsrefinedstorage,enderiointegrationforestry,enderiointegrationtic,enderiointegrationticlate,enderioinvpanel,enderiomachines,enderiopowertools,enderioendergy,codechickenlib,forgemultipartcbe,minecraftmultipartcbe,microblockcbe,mrtjpcore,wrcbe,modularmachinery,modularmachineryaddons
# fml.parallel.postInit.continueOnModError - Diagnostic-only mode that records a PostInit failure and keeps scheduling later mods. Use false for normal play.
fml.parallel.postInit.continueOnModError=false
# fml.parallel.postInit.dag.enabled - Uses dependency-aware scheduling for PostInit so independent later handlers can run while main-thread-only handlers execute.
fml.parallel.postInit.dag.enabled=true

# == LoadComplete Parallelism ==
# Controls FMLLoadCompleteEvent worker dispatch. This is the safest lifecycle phase, but HEI/JER and client-global mods can still serialize the wall time.
# fml.parallel.loadComplete.enabled - Enables worker dispatch for FMLLoadCompleteEvent handlers that pass the allowlist and denylist filters.
fml.parallel.loadComplete.enabled=true
# fml.parallel.loadComplete.workers - Worker count for LoadComplete. 0 inherits fml.parallel.workers, then automatic sizing if the shared value is also 0.
fml.parallel.loadComplete.workers=0
# fml.parallel.loadComplete.allowlist - Comma-separated mod ids allowed to run LoadComplete off-thread; '*' allows every loaded mod before denylist filtering.
fml.parallel.loadComplete.allowlist=*
# fml.parallel.loadComplete.denylist - Comma-separated mod ids forced back to the main thread during LoadComplete; entries here override the allowlist.
fml.parallel.loadComplete.denylist=betterportals,betterquesting,cofhcore,crafttweaker,iceandfire,jei,jeresources,journeymap,scannable,thaumicaugmentation,thebetweenlands,topaddons,enderio,enderiobase,enderioconduits,enderioconduitsappliedenergistics,enderioconduitsopencomputers,enderioconduitsrefinedstorage,enderiointegrationforestry,enderiointegrationtic,enderiointegrationticlate,enderioinvpanel,enderiomachines,enderiopowertools,enderioendergy,codechickenlib,forgemultipartcbe,minecraftmultipartcbe,microblockcbe,mrtjpcore,wrcbe,modularmachinery,modularmachineryaddons
# fml.parallel.loadComplete.continueOnModError - Diagnostic-only mode that records a LoadComplete failure and keeps scheduling later mods. Use false for normal play.
fml.parallel.loadComplete.continueOnModError=false
# fml.parallel.loadComplete.dag.enabled - Uses dependency-aware scheduling for LoadComplete, including independent lookahead around long main-thread handlers such as HEI.
fml.parallel.loadComplete.dag.enabled=true

# == Thread Safety Guards ==
# Global safety switches used by the lifecycle scheduler while phases are running in workers.
# fml.parallel.registrySerialization.enabled - Serializes Forge registry writes while lifecycle workers are active to avoid HashBiMap and ForgeRegistry concurrent mutation.
fml.parallel.registrySerialization.enabled=true
# fml.parallel.clientLifecycleOpenGlScan.enabled - Keeps PreInit/Init/PostInit/LoadComplete handlers on the main thread when their mod jar references LWJGL/OpenGL/Input bytecode. This preserves client thread affinity without editing denylists.
fml.parallel.clientLifecycleOpenGlScan.enabled=true
# fml.parallel.autoQuarantineGlErrors.enabled - Diagnostic helper that appends catchable OpenGL thread offenders to the relevant phase denylist for the next launch.
fml.parallel.autoQuarantineGlErrors.enabled=false
# fml.parallel.autoQuarantineGlErrors.includeRelatedMods - When auto-quarantining, also deny likely dependent/related mods so the next launch moves the whole cluster back to main thread.
fml.parallel.autoQuarantineGlErrors.includeRelatedMods=false

