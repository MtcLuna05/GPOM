plugins {
    id 'java'
    id 'java-library'
    id 'xyz.wagyourtail.unimined' version '1.4.18-kappa'
}

version = property('mod_version')
group = property('root_package')

base {
    archivesName = 'GPOM'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        url = 'https://maven.wagyourtail.xyz/releases'
    }
    maven {
        url = 'https://maven.wagyourtail.xyz/snapshots'
    }
    maven {
        url = 'https://maven.cleanroommc.com/releases'
    }
    maven {
        url = 'https://modmaven.dev/'
    }
    maven {
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    compileOnly 'org.scala-lang:scala-library:2.11.1'
    compileOnly 'com.cleanroommc:lwjglx:1.0.0'
    compileOnly modJarDependency('AoA3-3.3.6.jar', 'curse.maven:advent-of-ascension-nevermine-311054:3054253')
    compileOnly modJarDependency('CodeChickenLib-1.12.2-3.2.3.358-universal.jar', 'codechicken:CodeChickenLib:1.12.2-3.2.3.358:universal')
    compileOnly modJarDependency('ae2-uel-v0.56.5.jar', 'curse.maven:ae2-extended-life-570458:5378163')
    compileOnly modJarDependency('Baubles-1.12-1.5.2.jar', 'curse.maven:baubles-227083:2518667')
    compileOnly modJarDependency('EnderCore-1.12.2-0.5.78.jar', 'com.enderio.core:EnderCore:1.12.2-0.5.78')
    compileOnly modJarDependency('EnderIO-1.12.2-5.3.72.jar', 'com.enderio:EnderIO:1.12.2-5.3.72')
}

def modJarDependency(String fileName, String fallbackNotation) {
    if (!project.findProperty('gpom_use_remote_mod_deps')?.toString()?.toBoolean()) {
        def jarFile = localModJar(fileName)
        if (jarFile != null) {
            return files(jarFile)
        }
    }
    def dependency = dependencies.create(fallbackNotation)
    if (dependency.hasProperty('transitive')) {
        dependency.transitive = false
    }
    return dependency
}

def localModJar(String fileName) {
    def configuredMinecraftDir = project.findProperty('meatball_minecraft_dir')?.toString()
    if (configuredMinecraftDir == null || configuredMinecraftDir.trim().isEmpty()) {
        configuredMinecraftDir = System.getenv('MEATBALL_MINECRAFT_DIR')
    }
    if (configuredMinecraftDir == null || configuredMinecraftDir.trim().isEmpty()) {
        configuredMinecraftDir = new File(
                System.getProperty('user.home'),
                '.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher/instances/MeatballCraft, Dimensional Ascension/minecraft'
        ).absolutePath
    }

    def jarFile = file("${configuredMinecraftDir}/mods/${fileName}")
    return jarFile.isFile() ? jarFile : null
}

unimined.minecraft {
    version '1.12.2'

    mappings {
        mcp('stable', '39-1.12')
    }

    cleanroom {
        loader '0.5.12-alpha'
        runs.all {
            systemProperty('crl.dev.mixin', "${mod_id}.default.mixin.json,${mod_id}.mod.mixin.json")
            args += ['--username', minecraft_username]

            if (project.findProperty('is_coremod')?.toString()?.toBoolean()) {
                systemProperty('fml.coreMods.load', coremod_plugin_class_name)
            }

            def configuredJavaHome = project.findProperty('jbr_home')?.toString()
            if (configuredJavaHome != null && !configuredJavaHome.trim().isEmpty()) {
                doFirst {
                    executable = new File(configuredJavaHome.trim(), 'bin/java').absolutePath
                }
            }

            def extraArgs = project.findProperty('extra_jvm_args')?.toString()
            if (extraArgs != null && !extraArgs.trim().isEmpty()) {
                jvmArgs += extraArgs.trim().split(/\s+/).toList()
            }

            if (project.findProperty('enable_foundation_debug')?.toString()?.toBoolean()) {
                systemProperty('foundation.dump', 'true')
                systemProperty('foundation.verbose', 'true')
            }
        }
    }

    defaultRemapJar = false
    remap(tasks.named('jar').get()) {
        mixinRemap {
            enableBaseMixin()
            enableMixinExtra()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

jar {
    manifest {
        attributes(
                'FMLCorePlugin': coremod_plugin_class_name,
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true'
        )
    }
}
