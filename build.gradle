plugins {
    id 'java'
    id 'java-library'
    id 'xyz.wagyourtail.unimined' version '1.4.18-kappa'
}

version = property('mod_version')
group = property('root_package')

base {
    archivesName = property('mod_id')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        url = 'https://maven.wagyourtail.xyz/releases'
    }
    maven {
        url = 'https://maven.wagyourtail.xyz/snapshots'
    }
    maven {
        url = 'https://maven.cleanroommc.com/releases'
    }
}

dependencies {
    compileOnly files('/home/luna/.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher/instances/MeatballCraft, Dimensional Ascension/minecraft/mods/AoA3-3.3.6.jar')
}

unimined.minecraft {
    version '1.12.2'

    mappings {
        mcp('stable', '39-1.12')
    }

    cleanroom {
        loader '0.5.12-alpha'
        runs.all {
            systemProperty('crl.dev.mixin', "${mod_id}.default.mixin.json,${mod_id}.mod.mixin.json")
            args += ['--username', minecraft_username]

            if (project.findProperty('is_coremod')?.toString()?.toBoolean()) {
                systemProperty('fml.coreMods.load', coremod_plugin_class_name)
            }

            def configuredJavaHome = project.findProperty('jbr_home')?.toString()
            if (configuredJavaHome != null && !configuredJavaHome.trim().isEmpty()) {
                doFirst {
                    executable = new File(configuredJavaHome.trim(), 'bin/java').absolutePath
                }
            }

            def extraArgs = project.findProperty('extra_jvm_args')?.toString()
            if (extraArgs != null && !extraArgs.trim().isEmpty()) {
                jvmArgs += extraArgs.trim().split(/\s+/).toList()
            }

            if (project.findProperty('enable_foundation_debug')?.toString()?.toBoolean()) {
                systemProperty('foundation.dump', 'true')
                systemProperty('foundation.verbose', 'true')
            }
        }
    }

    defaultRemapJar = false
    remap(tasks.named('jar').get()) {
        mixinRemap {
            enableBaseMixin()
            enableMixinExtra()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

jar {
    manifest {
        attributes(
                'FMLCorePlugin': coremod_plugin_class_name,
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true'
        )
    }
}
